stack:
  backend:
    framework: "FastAPI"
    orm_and_validation: "SQLModel"
  database:
    engine: "PostgreSQL"
  frontend:
    framework: "Next.js (App Router)"
    language: "TypeScript"
    styling: "TailwindCSS"
    components: "shadcn/ui"
  infrastructure:
    containers: "Docker"
    orchestration: "docker-compose"

constraints:
  strict_mode: true
  forbidden_technologies:
    - "Qualquer framework backend alternativo (ex: Express, Django)"
    - "ORMs diferentes de SQLModel / SQLAlchemy"
    - "Bancos de dados NoSQL ou diferentes do PostgreSQL"
    - "Bibliotecas de UI alternativos (ex: Material UI, Chakra UI)"
    - "Gerenciadores de estado complexos não nativos (ex: Redux, MobX)"
  rules:
    - "NÃO gerar código."
    - "NÃO adicionar bibliotecas fora da stack definida."
    - "NÃO misturar comportamento com implementação nas specs."
