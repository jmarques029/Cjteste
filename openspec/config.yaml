schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

context: |
  Por favor, gere todos os artefatos em Português-BR.
  
  #Tech Stack - Backend
  - FastAPI
  - SQLAlchemy
  - Alembic
  - PostgreSQL
  - Docker
  - JWT
  
  #Tech Stack - Frontend
  - Next.js
  - React
  - TypeScript
  - TailwindCSS
  - Shadcn/UI

  #Domain
  - O projeto é um MVP (Proof of Concept) para um fluxo de autoatendimento de um Provedor de Internet (ISP).

rules: 
  proposal: |
    - Toda nova proposta deve especificar claramente os objetivos, não-objetivos e decisões que serão tomadas.
  
  specs: |
    - Use sempre o formato Given/When/Then(Dado/Quando/Então) par descrever os cenários.

  design: |
    - Backend: Detalhe os modelos de banco de dados (PostgreSQL) e como o schema do FastAPI/Pydantic garante o Type - safety ponta a ponta.
    - Frontend: Detalhe os componentes do shadcn/ui que serão utilizados e como o Next.js para criar o dashboard do admin.
  
  tasks: |
    - Sempre inclua tarefas que viabilem o TDD (Desenvolvimento orientado a testes), ou seja, primeiro deve-se criar o teste, para depois criar a funcionalidade definida.
    - Mantenha os itens pequenos, sequenciais e fáceis de serem implementados em uma única sessão de trabalho.
