name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-backend:
    name: Backend CI (FastAPI / Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov
          pip install -r backend/requirements.txt

      - name: Run Formatter Check (Ruff)
        run: |
          cd backend
          ruff format --check .

      - name: Run Linter (Ruff)
        run: |
          cd backend
          ruff check .

      - name: Run Type Check (Mypy)
        run: |
          cd backend
          mypy .

      - name: Run Tests (Pytest)
        run: |
          cd backend
          pytest -v --cov=src

  ci-frontend:
    name: Frontend CI (Next.js / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Formatter Check (Prettier)
        run: |
          cd frontend
          npm run format:check

      - name: Run Linter (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Run Type Check (TypeScript)
        run: |
          cd frontend
          npm run typecheck

      - name: Run Tests (Vitest)
        run: |
          cd frontend
          npm run test run

  cd:
    name: Continuous Deployment (Docker Hub & Render)
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cjnet-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/cjnet-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cjnet-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/cjnet-frontend:${{ github.sha }}

      - name: Trigger Render Backend Deploy
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK != '' }}
        run: |
          curl -f -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Trigger Render Frontend Deploy
        if: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK != '' }}
        run: |
          curl -f -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
