name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "Matheus" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-pipeline.yml'
  pull_request:
    branches: [ "Matheus" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-pipeline.yml'

jobs:
  ci:
    name: Backend CI (FastAPI / Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov
          pip install -r backend/requirements.txt

      - name: Run Formatter Check (Ruff)
        run: |
          cd backend
          ruff format --check .

      - name: Run Linter (Ruff)
        run: |
          cd backend
          ruff check .

      - name: Run Type Check (Mypy)
        run: |
          cd backend
          mypy .

      - name: Run Tests (Pytest)
        run: |
          cd backend
          pytest -v --cov=src

  cd:
    name: Backend CD (Docker Hub & Render)
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/Matheus' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: matheuscanaverde/cjnet-backend:latest
          
      - name: Trigger Render Backend Deploy
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK != '' }}
        run: |
          curl -f -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
